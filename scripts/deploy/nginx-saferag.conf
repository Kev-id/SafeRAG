# SafeRAG 前后端分离 —— 盒子上的 nginx 站点配置
# 放置: /etc/nginx/conf.d/saferag.conf
#
# 结构: 前端静态(dist)由 nginx 直接托管; /api 反代后端 8081。
# 引擎(8000/8001)只被后端进程内部调用, nginx 不碰 —— 所以没有 /v1/、/health。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ---------- 前端静态 ----------
    root /opt/saferag/frontend;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;   # SPA 路由回退
    }

    # ---------- 后端业务 API (8081) ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8081;   # 末尾不加斜杠
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 文档处理/上传较长, 上传上限对齐知识库 20MB
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20m;
    }

    # ---------- 聊天 SSE 流: 关缓冲出逐字效果, 超时放宽到 600s ----------
    location /api/v1/chat/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # ---------- FastAPI 接口文档 ----------
    location /docs {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8081/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}