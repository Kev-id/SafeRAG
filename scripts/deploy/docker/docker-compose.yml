# =============================================================================
# SafeRAG 容器编排 —— 「部署文件夹」自包含版。
# 用法: 把本文件夹(docker-compose.yml + nginx/ + models/ + emergency-platform/frontend/)
#       拷到目标盒子, 进本目录: docker compose up -d 即可。模型/前端挂载相对本目录。
# 仍是 host 网络 + 127.0.0.1:8000/8001/8081 + 宿主 80 的拓扑。
#
# 必须留在宿主的(不进文件夹, 也不该打包):
#   - /opt/sophon/libsophon-current/lib  : NPU 运行时, 与盒子内核驱动配对(引擎容器挂载它)
#   - /dev/bm-tpu0 /dev/bmdev-ctl /dev/ion : 内核设备节点
#   - 后端运行数据 /data/SafeRAG/backend/data : 固定在宿主, 避免整夹覆盖时把库一起换掉
# =============================================================================
x-npu: &npu
  network_mode: host
  restart: unless-stopped
  devices:
    - /dev/bm-tpu0:/dev/bm-tpu0
    - /dev/bmdev-ctl:/dev/bmdev-ctl
    - /dev/ion:/dev/ion
  shm_size: 2g
  environment:
    # 运行时用宿主自己的 libsophon(与驱动版本配对), 不烤进镜像
    LD_LIBRARY_PATH: /opt/sophon/libsophon-current/lib

# 引擎容器共用的挂载: 宿主 libsophon(ro) + 本文件夹 models(引擎需读写! 见下)
# ⚠ models 不挂 :ro: 部分 libsophon 版本(如 0.5.1)以"读写"方式打开 bmodel, 只读挂载会让它
#   打开失败(libbmrt 报 "File open failed")。backend 只读即够, 仍保持 ro。
x-eng-volumes: &eng-volumes
  - /opt/sophon/libsophon-current/lib:/opt/sophon/libsophon-current/lib:ro
  - ./models:/models

services:
  qwen-doc:
    <<: *npu
    image: saferag-qwen:1.0.0
    container_name: qwen-doc
    volumes: *eng-volumes
    command: python server.py -m /models/Qwen3_5/qwen3.5-4b_w4bf16_bm1688.bmodel -c /models/Qwen3_5/config --host 127.0.0.1 --port 8000

  qwen-chat:
    <<: *npu
    image: saferag-qwen:1.0.0
    container_name: qwen-chat
    volumes: *eng-volumes
    command: python server.py -m /models/Qwen3_5/qwen3.5-2b-int4-autoround_w4bf16_seq8192_bm1688_2core_history_dynamic_20260728_111707.bmodel -c /models/Qwen3_5/config --host 127.0.0.1 --port 8001

  backend:
    image: saferag-backend:1.0.0
    container_name: saferag-backend
    network_mode: host
    restart: unless-stopped
    environment:
      # 与现状一致的弱密钥; 收紧见 README.md
      JWT_SECRET: "${JWT_SECRET:-saferag-dev-secret-please-change-in-prod}"
      QWEN_CONNECT_TIMEOUT: "5"
      QWEN_READ_TIMEOUT: "600"
      QWEN_MAX_TOKENS: "4096"
    volumes:
      - ./models:/models:ro
      # 运行数据(库/知识库/上传文档)固定在宿主, 不做进部署文件夹
      - /data/SafeRAG/backend/data:/data/saferag/backend/data

  nginx:
    image: nginx:alpine
    container_name: saferag-nginx
    network_mode: host
    restart: unless-stopped
    depends_on:
      - qwen-doc
      - qwen-chat
      - backend
    volumes:
      - ./emergency-platform/frontend:/usr/share/nginx/html:ro
      - ./nginx/saferag.conf:/etc/nginx/conf.d/default.conf:ro