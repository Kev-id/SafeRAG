# =============================================================================
# 应急安全综合平台 —— nginx 容器站点(挂载为 /etc/nginx/conf.d/default.conf)。
# 与宿主机 scripts/deploy/nginx/sites-available/SafeRAG 同构, 仅两处不同:
#   1) root 指向容器内 /usr/share/nginx/html(外层 /data2/www/.../frontend 挂载进来)
#   2) 放 conf.d/(nginx:alpine 只有 conf.d, 没有 sites-available)
# 全部 host 网络, 上游 127.0.0.1:8000/8001/8081 直达各容器。
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------
    # 1. SafeRAG 业务 API (backend 容器 8081)
    # -------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20m;
    }

    # -------------------------------------------------------------
    # 2. Qwen3.5 大模型 API (qwen-doc 容器 8000) —— SSE 流式必须关闭缓冲
    # -------------------------------------------------------------
    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------
    # 3. 后端 API 文档 (backend 容器 8081)
    # -------------------------------------------------------------
    location /docs {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8081/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -------------------------------------------------------------
    # 静态文件缓存(可选)
    # -------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}